# NanoPi R3S 路由器专用构建配置
BOARD="nanopi-r3s"
BRANCH="current"
KERNEL_GIT="shallow"

# R3S 是无 WiFi 的纯有线路由器，跳过全部树外无线驱动
# （避免 Linux 6.18+ ieee80211_ptr API 变更导致的编译错误）
EXTRAWIFI="no"

# 关闭 BTF 调试信息（精简内核 ~3MiB）

# 裁剪模式选择（与 trim-r3s-kernel.sh --mode 对齐）
#   minimal - 纯路由器（默认），最大裁剪
#   docker  - 保留容器栈（Docker/Podman）
#   ebpf    - 保留 eBPF 工具链（cilium/bpftrace/bcc）
#   full    - docker + ebpf 全开
# 优先级：环境变量 R3S_TRIM_MODE > userpatches/.trim-mode 标记文件 > minimal
# export R3S_TRIM_MODE="minimal"

# 启用 R3S 内核裁剪钩子
ENABLE_EXTENSIONS="nanopir3s-kconfig"
# custom_kernel_config 钩子会进一步撤销 Armbian 注入的 eBPF/Ftrace/Kprobes 等
# 注：钩子内部的裁剪模式由 .trim-mode 文件或 R3S_TRIM_MODE 环境变量控制
KERNEL_BTF="no"

# 使用裁剪后的内核配置
# KERNEL_CONFIGURE="no"

# 只构建内核
# BUILD_DESKTOP="no"
# BUILD_MINIMAL="yes"
