# NanoPi R3S 路由器专用构建配置
BOARD="nanopi-r3s"
BRANCH="current"
KERNEL_GIT="shallow"

# 关闭 BTF 调试信息（精简内核 ~3MiB）

# 启用 R3S 内核裁剪钩子
ENABLE_EXTENSIONS="nanopir3s-kconfig"
# custom_kernel_config 钩子会进一步撤销 Armbian 注入的 eBPF/Ftrace/Kprobes 等
KERNEL_BTF="no"

# 使用裁剪后的内核配置
# KERNEL_CONFIGURE="no"

# 只构建内核
# BUILD_DESKTOP="no"
# BUILD_MINIMAL="yes"
