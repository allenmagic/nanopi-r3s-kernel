# Build NanoPi R3S Trimmed Kernel Bundle → GitHub Release
# 独立构建裁剪内核 + u-boot + dtb + modules，打包为 boot bundle 发布到 Release，
# 供 nanopi-r3s-img 的 build_img workflow 直接下载引用（无需每次现场编译 Armbian）。
#
# 一次触发编译全部 4 种裁剪模式（matrix 并行），统一发布到同一个 Release：
#   Release tag：kernel-YYYYMMDD
#   Release 资产命名：armbian-boot-rk3566-<mode>.tar.gz（按模式区分）
# img 构建时按 kernel_mode 下载对应模式的资产。

name: Build All Trimmed Kernels

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  ARMBIAN_BUILD_DIR: /tmp/armbian-build
  # ccache 上限 2G/模式（4 模式 ≈ 8GB + 源码 1GB，压在 GitHub 免费 10GB 缓存额度内）
  CCACHE_MAXSIZE: 2G

jobs:
  # 统一 release tag（所有模式发布到同一个 release，资产按模式名区分）
  prepare:
    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Resolve release tag
        id: tag
        run: echo "release_tag=kernel-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build-kernel:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      fail-fast: false
      matrix:
        kernel_mode: [minimal, docker, ebpf, full]
    name: build-kernel-${{ matrix.kernel_mode }}
    env:
      KERNEL_MODE: ${{ matrix.kernel_mode }}
    steps:
      # 本 repo checkout（Copy self 步骤需要 ${{ github.workspace }} 有内容）
      - name: Checkout
        uses: actions/checkout@v6

      # ----------------------------------------------------------
      # 1. 克隆 Armbian build
      # ----------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common

      - name: Clone Armbian build repo
        run: |
          for i in 1 2 3; do
            git clone --depth=1 -b main \
              "https://github.com/armbian/build.git" \
              "${{ env.ARMBIAN_BUILD_DIR }}" && break || {
              echo "Clone attempt $i failed, retrying in $((i * 5)) seconds..."
              sleep $((i * 5))
              rm -rf "${{ env.ARMBIAN_BUILD_DIR }}"
            }
          done
          cd "${{ env.ARMBIAN_BUILD_DIR }}"
          git log -1 --oneline

      # ----------------------------------------------------------
      # 1b. 恢复编译缓存（ccache + 内核源码），clone 之后执行
      #     key 用 run_id 唯一（actions/cache 同 key 不覆盖保存），
      #     restore-keys 按模式前缀取最近一次缓存
      # ----------------------------------------------------------
      - name: Restore Armbian build cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ARMBIAN_BUILD_DIR }}/cache/ccache
            ${{ env.ARMBIAN_BUILD_DIR }}/cache/sources
          key: armbian-cache-${{ matrix.kernel_mode }}-${{ github.run_id }}
          restore-keys: |
            armbian-cache-${{ matrix.kernel_mode }}-

      # ----------------------------------------------------------
      # 2. 注入本 repo（裁剪 config + 钩子）为 Armbian userpatches
      # ----------------------------------------------------------
      - name: Copy self to Armbian userpatches
        run: |
          cp -a "${{ github.workspace }}" "${{ env.ARMBIAN_BUILD_DIR }}/userpatches"

          cd "${{ env.ARMBIAN_BUILD_DIR }}"

          # 验证关键文件存在
          if [ ! -f "userpatches/config-nanopir3s.conf" ]; then
            echo "错误: config-nanopir3s.conf 不存在"
            ls -la userpatches/ || true
            exit 1
          fi

          # 骨架目录（Armbian 约定）
          mkdir -p userpatches/{atf,crust,kernel,misc,overlay,u-boot}

          # 双保险传递 kernel_mode：
          # 1) .trim-mode 文件（扩展钩子读取）
          echo "${{ env.KERNEL_MODE }}" > userpatches/.trim-mode
          # 2) 环境变量（trim-r3s-kernel.sh 和钩子均可读取）
          echo "R3S_TRIM_MODE=${{ env.KERNEL_MODE }}" >> "$GITHUB_ENV"

          echo "=== userpatches 内容 ==="
          ls -la userpatches/
          echo "=== 裁剪模式: ${{ env.KERNEL_MODE }} ==="

      # ----------------------------------------------------------
      # 3. 编译内核 + u-boot
      # ----------------------------------------------------------
      - name: Build kernel
        run: |
          cd "${{ env.ARMBIAN_BUILD_DIR }}"
          ./compile.sh kernel nanopir3s

      - name: Show deb artifacts
        run: |
          echo "=== output/debs/ ==="
          ls -lh "${{ env.ARMBIAN_BUILD_DIR }}/output/debs/" || true

      # ----------------------------------------------------------
      # 4. dpkg-deb 提取并打包 boot bundle
      #    u-boot 由独立的 build-uboot job 编译一次，此处下载共享
      #    （u-boot 编译 ~10min，远早于本 job 内核编译完成，artifact 必已就绪）
      # ----------------------------------------------------------
      - name: Download u-boot artifact
        uses: actions/download-artifact@v8
        with:
          name: uboot-rk3566
          path: uboot-artifact

      - name: Extract and package boot artifacts
        id: package
        run: |
          set -e
          DEBS_DIR="${{ env.ARMBIAN_BUILD_DIR }}/output/debs"
          EXTRACT_DIR="/tmp/boot-extract"
          BUNDLE_DIR="/tmp/boot-bundle"
          rm -rf "${EXTRACT_DIR}" "${BUNDLE_DIR}"
          mkdir -p "${EXTRACT_DIR}" \
                   "${BUNDLE_DIR}/boot/extlinux" \
                   "${BUNDLE_DIR}/boot/dtb/rockchip" \
                   "${BUNDLE_DIR}/lib"

          # --- linux-image（vmlinuz + modules）---
          IMAGE_DEB=$(ls "${DEBS_DIR}"/linux-image-current-rockchip64_*.deb 2>/dev/null | head -1)
          [ -n "${IMAGE_DEB}" ] || { echo "错误: 未找到 linux-image deb"; ls "${DEBS_DIR}"; exit 1; }
          echo "=== 提取 linux-image: $(basename ${IMAGE_DEB}) ==="
          dpkg-deb -x "${IMAGE_DEB}" "${EXTRACT_DIR}/image"
          cp -a "${EXTRACT_DIR}/image/boot/"* "${BUNDLE_DIR}/boot/"
          mkdir -p "${BUNDLE_DIR}/lib/modules"
          cp -a "${EXTRACT_DIR}/image/lib/modules/"* "${BUNDLE_DIR}/lib/modules/"

          # --- linux-dtb（rk3566-nanopi-r3s.dtb）---
          DTB_DEB=$(ls "${DEBS_DIR}"/linux-dtb-current-rockchip64_*.deb 2>/dev/null | head -1)
          if [ -n "${DTB_DEB}" ]; then
            echo "=== 提取 DTB: $(basename ${DTB_DEB}) ==="
            dpkg-deb -x "${DTB_DEB}" "${EXTRACT_DIR}/dtb"
            DTB_FILE=$(find "${EXTRACT_DIR}/dtb" -name "rk3566-nanopi-r3s.dtb" | head -1)
          else
            DTB_FILE=$(find "${EXTRACT_DIR}/image" -name "rk3566-nanopi-r3s.dtb" | head -1)
          fi
          [ -n "${DTB_FILE}" ] || { echo "错误: 未找到 rk3566-nanopi-r3s.dtb"; exit 1; }
          echo "  -> $(basename ${DTB_FILE})"
          cp "${DTB_FILE}" "${BUNDLE_DIR}/boot/dtb/rockchip/rk3566-nanopi-r3s.dtb"

          # --- linux-u-boot（共享 artifact，build-uboot job 编译一次）---
          UBOOT_BIN="uboot-artifact/u-boot-rockchip.bin"
          [ -f "${UBOOT_BIN}" ] || { echo "错误: 未找到 u-boot-rockchip.bin（build-uboot artifact）"; ls uboot-artifact/; exit 1; }
          echo "  -> u-boot-rockchip.bin ($(du -h ${UBOOT_BIN} | cut -f1))"
          cp "${UBOOT_BIN}" "${BUNDLE_DIR}/u-boot-rockchip.bin"

          # --- extlinux.conf ---
          VMLINUZ=$(ls "${BUNDLE_DIR}/boot"/vmlinuz-* 2>/dev/null | head -1)
          [ -n "${VMLINUZ}" ] || { echo "错误: 未找到 vmlinuz"; ls "${BUNDLE_DIR}/boot/"; exit 1; }
          KERNEL_FILE="$(basename ${VMLINUZ})"
          echo "=== 生成 extlinux.conf (KERNEL=${KERNEL_FILE}) ==="
          cat > "${BUNDLE_DIR}/boot/extlinux/extlinux.conf" << EXTCONF
          TIMEOUT 10
          DEFAULT linux

          MENU TITLE NanoPi R3S Router

          LABEL linux
              MENU LABEL Linux (default)
              KERNEL /boot/${KERNEL_FILE}
              FDT /boot/dtb/rockchip/rk3566-nanopi-r3s.dtb
              APPEND root=/dev/mmcblk1p1 rootwait rw rootfstype=ext4 console=ttyS2,1500000 console=tty1 net.ifnames=0 loglevel=7
          EXTCONF

          # --- 统一所有权并打包 ---
          sudo chown -R 0:0 "${BUNDLE_DIR}"
          BOOT_PKG="armbian-boot-rk3566-${{ env.KERNEL_MODE }}.tar.gz"
          tar czf "${BOOT_PKG}" \
            --owner=0 --group=0 --numeric-owner --mtime='@0' --sort=name \
            -C "${BUNDLE_DIR}" .
          ls -lh "${BOOT_PKG}"
          echo "boot_pkg=${BOOT_PKG}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # 5. 上传 artifact（发布由独立 release job 统一处理）
      # ----------------------------------------------------------
      - name: Upload boot artifact
        uses: actions/upload-artifact@v7
        with:
          name: armbian-boot-rk3566-${{ matrix.kernel_mode }}
          path: ${{ steps.package.outputs.boot_pkg }}
          if-no-files-found: error

  # ============================================================
  # u-boot：与裁剪模式无关，独立 job 编译一次，4 个 kernel job 共享
  #   （编译 ~10min，远早于 kernel job 完成，kernel 打包时 artifact 已就绪）
  # ============================================================
  build-uboot:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      KERNEL_MODE: minimal   # u-boot 与裁剪模式无关
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common

      - name: Clone Armbian build repo
        run: |
          for i in 1 2 3; do
            git clone --depth=1 -b main \
              "https://github.com/armbian/build.git" \
              "${{ env.ARMBIAN_BUILD_DIR }}" && break || {
              echo "Clone attempt $i failed, retrying in $((i * 5)) seconds..."
              sleep $((i * 5))
              rm -rf "${{ env.ARMBIAN_BUILD_DIR }}"
            }
          done

      - name: Copy self to Armbian userpatches
        run: |
          cp -a "${{ github.workspace }}" "${{ env.ARMBIAN_BUILD_DIR }}/userpatches"
          cd "${{ env.ARMBIAN_BUILD_DIR }}"
          mkdir -p userpatches/{atf,crust,kernel,misc,overlay,u-boot}
          echo "${{ env.KERNEL_MODE }}" > userpatches/.trim-mode
          echo "R3S_TRIM_MODE=${{ env.KERNEL_MODE }}" >> "$GITHUB_ENV"
          echo "=== 裁剪模式（u-boot 构建用）: ${{ env.KERNEL_MODE }} ==="

      - name: Build u-boot
        run: |
          cd "${{ env.ARMBIAN_BUILD_DIR }}"
          ./compile.sh uboot nanopir3s

      - name: Extract u-boot binary
        run: |
          set -e
          DEBS_DIR="${{ env.ARMBIAN_BUILD_DIR }}/output/debs"
          echo "=== output/debs/ ==="
          ls -lh "${DEBS_DIR}" || true
          UBOOT_DEB=$(ls "${DEBS_DIR}"/linux-u-boot-*-current_*.deb 2>/dev/null | head -1)
          [ -n "${UBOOT_DEB}" ] || { echo "错误: 未找到 u-boot deb"; exit 1; }
          echo "=== 提取 u-boot: $(basename ${UBOOT_DEB}) ==="
          dpkg-deb -x "${UBOOT_DEB}" /tmp/uboot-extract
          UBOOT_BIN=$(find /tmp/uboot-extract -name "u-boot-rockchip.bin" | head -1)
          [ -n "${UBOOT_BIN}" ] || { echo "错误: 未找到 u-boot-rockchip.bin"; find /tmp/uboot-extract -type f; exit 1; }
          mkdir -p artifact
          cp "${UBOOT_BIN}" artifact/u-boot-rockchip.bin
          ls -lh artifact/

      - name: Upload u-boot artifact
        uses: actions/upload-artifact@v7
        with:
          name: uboot-rk3566
          path: artifact/u-boot-rockchip.bin
          if-no-files-found: error

  # ============================================================
  # 发布：全部模式编译成功后，统一上传到同一个 Release
  #   tag: kernel-YYYYMMDD，资产 armbian-boot-rk3566-<mode>.tar.gz
  #   任一模式编译失败则本 job 自动跳过（不发布残缺 release）
  # ============================================================
  release:
    needs: [prepare, build-kernel]
    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
      - name: Download all boot artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: "Trimmed Kernel ${{ needs.prepare.outputs.release_tag }}"
          files: dist/*
          draft: false
          prerelease: false
          # v3 无 update_release 参数（v2 移除）：已存在的同名 release 自动更新，
          # overwrite_files 控制同名资产覆盖（同一天重复构建时）
          overwrite_files: true
